<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Letters — Anu</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="index.html">Anu ♥</a>
      <div class="links">
        <a href="bouquet.html">Bouquet</a>
        <a href="letters.html" aria-current="page">Letters</a>
        <a href="gallery.html">Gallery</a>
      </div>
    </nav>
  </header>

  <main class="page">
    <h2>Love Letters</h2>
    <p class="subtitle">Short notes — open one to read, then close it and keep the feeling.</p>

    <div class="floating-hearts" aria-hidden="true">
      <div class="fheart">❤</div>
      <div class="fheart">❤</div>
      <div class="fheart">❤</div>
    </div>

    <ul class="letters">
      <li><button class="letter" data-title="First Morning" data-body="Remember the first day after we started dating. I still love you the same way.">First Morning</button></li>
      <li><button class="letter" data-title="Quiet Night" data-body="Our quiet nights and little adventures — I'll remember them freshly forever.">Quiet Night</button></li>
      <li><button class="letter" data-title="Little Things" data-body="Little things like your smile make my day brighter. ">Little Things</button></li>
    </ul>

    <div id="modal" class="modal" hidden>
      <div class="modal-card">
        <button id="close" class="close">×</button>
        <h3 id="modal-title"></h3>
        <p id="modal-body"></p>
        <div class="modal-actions">
          <button id="copy">Close</button>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
